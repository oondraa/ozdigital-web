<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat | OZDIGITAL</title>
<meta name="description" content="Send OZDIGITAL a message. It goes straight to our phone and we reply within 24 hours.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://ozdigital.pages.dev/chat.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/phosphor/style.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  @font-face {
    font-family: "Geist";
    src: url("/fonts/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Geist";
    src: url("/fonts/geist-latin-ext-wght-normal.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --bg: #f4f4f5;
    --surface: #ffffff;
    --surface-2: #e9e9ec;
    --text: #111114;
    --muted: #595963;
    --line: rgba(17, 17, 20, 0.1);
    --accent: #1760f0;
    --accent-fill: #1760f0;
    --accent-fill-hover: #0f4fd0;
    --nav-bg: rgba(244, 244, 245, 0.78);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0d;
      --surface: #141417;
      --surface-2: #1c1c20;
      --text: #ececef;
      --muted: #a0a0ab;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #5b93ff;
      --accent-fill: #1f66f2;
      --accent-fill-hover: #3a7aff;
      --nav-bg: rgba(11, 11, 13, 0.74);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #141417;
    --surface-2: #1c1c20;
    --text: #ececef;
    --muted: #a0a0ab;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #5b93ff;
    --accent-fill: #1f66f2;
    --accent-fill-hover: #3a7aff;
    --nav-bg: rgba(11, 11, 13, 0.74);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  /* Hide the text caret that browsers show with caret browsing (F7) on plain text; keep it where you type. */
  body { caret-color: transparent; }
  input, textarea, [contenteditable] { caret-color: auto; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  textarea, button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px; }

  .nav {
    position: sticky; top: 0; z-index: 20; background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav .wrap { height: 64px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); justify-self: start; padding: 8px 12px 8px 8px; border-radius: 999px; transition: background 0.2s var(--ease), color 0.2s var(--ease); }
  .back:hover { color: var(--text); background: var(--surface-2); }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }

  main { flex: 1; display: flex; }
  main .wrap { display: flex; flex-direction: column; padding-top: 32px; padding-bottom: 24px; }
  #thread { display: flex; flex-direction: column; gap: 10px; padding-bottom: 24px; }
  .bubble { max-width: 78%; border-radius: 16px; padding: 12px 16px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; animation: pop 0.35s var(--ease) both; }
  .bubble.in { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); }
  .bubble.out { align-self: flex-end; background: var(--accent-fill); color: #fff; }
  .note { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 15px; }
  .note a { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

  .composer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .composer label { font-size: 14px; font-weight: 500; color: var(--muted); padding-left: 4px; }
  .field {
    display: flex; align-items: flex-end; gap: 10px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px;
    transition: border-color 0.2s var(--ease);
  }
  .field:focus-within { border-color: var(--accent); }
  .field textarea:focus-visible { outline: none; } /* the field's own border already shows focus */
  textarea { flex: 1; min-width: 0; border: none; outline: none; resize: none; background: transparent; font-size: 16px; line-height: 1.5; padding: 9px 0; max-height: 160px; }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 42px; height: 42px; flex-shrink: 0; border: none; border-radius: 999px; background: var(--accent-fill); color: #fff;
    cursor: pointer; display: grid; place-items: center; font-size: 19px;
    transition: background 0.2s var(--ease), transform 0.15s var(--ease);
  }
  .send:hover { background: var(--accent-fill-hover); }
  .send:active { transform: scale(0.94); }
  .hint { font-size: 13px; color: var(--muted); padding-left: 4px; }
  .send:disabled { opacity: 0.5; cursor: progress; }
  .bubble.muted { color: var(--muted); font-size: 15px; }
  /* Honeypot field: off-screen for people, still in the form for bots. */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  @media (max-width: 767px) { .wrap { padding: 0 16px; } main .wrap { padding-top: 24px; } }
</style>
</head>
<body>

  <header class="nav">
    <div class="wrap">
      <a class="back" href="index.html"><i class="ph ph-arrow-left" aria-hidden="true"></i><span data-i18n="back">Back</span></a>
      <span class="title" data-i18n="title">Chat with OZDIGITAL</span>
      <span></span>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div id="thread" aria-live="polite">
        <div class="bubble in" data-i18n="hello">Hi! Tell us about your idea: a website, an app, a system, anything.</div>
      </div>

      <form class="composer" id="composer" novalidate>
        <label for="draft" id="draft-label" data-i18n="labelMsg">Your message</label>
        <div class="field">
          <textarea id="draft" rows="1" data-i18n-ph="phMsg" placeholder="Write a message"></textarea>
          <button id="send-btn" class="send" type="submit" aria-label="Send"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>
        </div>
        <input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="hint"><span data-i18n="hint">The message goes straight to our phone. We reply within 24 hours.</span> <a href="ochrana-osobnich-udaju.html" data-i18n="privacy">How we handle your data</a></div>
      </form>
    </div>
  </main>

<script>
(function () {
  var EMAIL = "o.zajicek12@gmail.com";
  var T = {
    en: {
      back: "Back", title: "Chat with OZDIGITAL",
      hello: "Hi! Tell us about your idea: a website, an app, a system, anything.",
      labelMsg: "Your message", phMsg: "Write a message",
      labelContact: "Email or phone", phContact: "Email or phone number",
      hint: "The message goes straight to our phone. We reply within 24 hours.",
      privacy: "How we handle your data",
      askContact: "Thanks! Where should we get back to you? Leave an email or a phone number.",
      badContact: "That doesn't look like an email or a phone number. Could you check it?",
      sending: "Sending…",
      done: "Done, we've got your message. We'll get back to you within 24 hours, usually much sooner.",
      more: "Want to add something? Just write it, it goes to us too.",
      fail: "Something went wrong on our side and the message didn't go through. Please send it by email instead:",
      failLink: "Send via email"
    },
    cz: {
      back: "Zpět", title: "Chat s OZDIGITAL",
      hello: "Ahoj! Napište, s jakým nápadem přicházíte: web, aplikace, systém, cokoliv.",
      labelMsg: "Vaše zpráva", phMsg: "Napište zprávu",
      labelContact: "E-mail nebo telefon", phContact: "E-mail nebo telefonní číslo",
      hint: "Zpráva přijde rovnou nám do mobilu. Odpovídáme do 24 hodin.",
      privacy: "Jak nakládáme s vašimi údaji",
      askContact: "Díky! Kam se vám máme ozvat? Napište e-mail nebo telefon.",
      badContact: "Tohle nevypadá jako e-mail ani telefon. Zkontrolujete to prosím?",
      sending: "Odesílám…",
      done: "Hotovo, zprávu máme. Ozveme se do 24 hodin, většinou mnohem dřív.",
      more: "Chcete ještě něco doplnit? Klidně pište, přijde nám to taky.",
      fail: "Něco se u nás pokazilo a zpráva neodešla. Pošlete ji prosím e-mailem:",
      failLink: "Poslat e-mailem"
    }
  };
  // Same language choice as the main page: saved toggle wins, otherwise Czech.
  var lang = "cz";
  try { var saved = localStorage.getItem("lang"); if (saved) lang = saved === "cz" ? "cz" : "en"; } catch (e) {}
  var t = T[lang];
  document.documentElement.lang = lang === "cz" ? "cs" : "en";
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i18n")]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(function (el) { el.placeholder = t[el.getAttribute("data-i18n-ph")]; });

  var thread = document.getElementById("thread");
  var form = document.getElementById("composer");
  var draft = document.getElementById("draft");
  var label = document.getElementById("draft-label");
  var sendBtn = document.getElementById("send-btn");
  var honeypot = document.getElementById("website");

  // step: "message" -> "contact" -> "sent" (after that, extra messages go out right away with the same contact)
  var step = "message";
  var pending = [];
  var contact = "";
  var busy = false;

  function bubble(text, who) {
    var div = document.createElement("div");
    div.className = "bubble " + who;
    div.textContent = text;
    thread.appendChild(div);
    div.scrollIntoView({ block: "end" });
    return div;
  }

  function looksLikeContact(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || v.replace(/\D/g, "").length >= 9;
  }

  function setMode(mode) {
    var isContact = mode === "contact";
    label.textContent = isContact ? t.labelContact : t.labelMsg;
    draft.placeholder = isContact ? t.phContact : t.phMsg;
  }

  function autosize() {
    draft.style.height = "auto";
    draft.style.height = Math.min(draft.scrollHeight, 160) + "px";
  }

  function failNote(text) {
    var div = bubble("", "in note");
    var p = document.createElement("span");
    p.textContent = t.fail;
    var a = document.createElement("a");
    a.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(lang === "cz" ? "Zpráva z webu OZDIGITAL" : "Message from the OZDIGITAL website") + "&body=" + encodeURIComponent(text + "\n\n" + contact);
    a.innerHTML = '<span></span> <i class="ph ph-arrow-right" aria-hidden="true"></i>';
    a.firstChild.textContent = t.failLink;
    div.appendChild(p);
    div.appendChild(a);
    div.scrollIntoView({ block: "end" });
  }

  function deliver(text, after) {
    busy = true;
    sendBtn.disabled = true;
    var status = bubble(t.sending, "in muted");
    fetch("/api/contact", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, contact: contact, lang: lang, website: honeypot.value })
    })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (res) {
        status.remove();
        if (!res.ok) throw new Error(res.error || "failed");
        after();
      })
      .catch(function () {
        status.remove();
        failNote(text);
      })
      .then(function () {
        busy = false;
        sendBtn.disabled = false;
      });
  }

  function send() {
    var text = draft.value.trim();
    if (!text || busy) { draft.focus(); return; }
    draft.value = "";
    autosize();

    if (step === "message") {
      bubble(text, "out");
      pending.push(text);
      step = "contact";
      setMode("contact");
      setTimeout(function () { bubble(t.askContact, "in"); }, 350);
      return;
    }

    if (step === "contact") {
      bubble(text, "out");
      if (!looksLikeContact(text)) { bubble(t.badContact, "in"); return; }
      contact = text;
      step = "sent";
      setMode("message");
      deliver(pending.join("\n\n"), function () {
        pending = [];
        bubble(t.done, "in");
        setTimeout(function () { bubble(t.more, "in"); }, 600);
      });
      return;
    }

    bubble(text, "out");
    deliver(text, function () {});
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); send(); });
  draft.addEventListener("input", autosize);
  draft.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  draft.focus();
  draft.setSelectionRange(draft.value.length, draft.value.length);
})();
</script>
</body>
</html>
